# 本地一键起 API（fx1 B-12）。前端仍是静态产物，由任意静态服务器 / CDN 托管。
# 启动：docker compose up -d --build
# 配置：复制 .env.example 为 .env，至少修改 ADMIN_PASS / EDITOR_PASS / IP_SALT。
services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: wyx-api:local
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      HOST: 0.0.0.0
      API_DATA_DIR: /data
      API_CORS_ORIGIN: ${API_CORS_ORIGIN:-http://localhost:5173,http://localhost:4173,https://wyx.space}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-change-me}
      EDITOR_USER: ${EDITOR_USER:-editor}
      EDITOR_PASS: ${EDITOR_PASS:-change-me}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      IP_SALT: ${IP_SALT:-change-me}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-deepseek-chat}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
    volumes:
      # 与 npm run api 使用同一个数据目录；JSON 持久化，备份可直接拷走
      - ./server/data:/data
