<!doctype html>
<html lang="zh-CN" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>晓叶 · WYX.SPACE</title>
    <meta
      name="description"
      content="晓叶的个人动态主页 — AI 全栈 / 智能体开发。项目、学习笔记、生活碎片与成长时间轴。"
    />
    <meta name="theme-color" content="#F4F0E6" />
    <meta name="author" content="晓叶" />
    <!-- 主题引导脚本同步执行，preload 减少一次往返（fx2 FE-15） -->
    <link rel="preload" as="script" href="/theme-boot.js" />

    <!-- SEO / 分享卡片（fx.md S1–S3）：页面级 title/description/canonical 由 useSeo 覆盖 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WYX.SPACE" />
    <meta property="og:title" content="晓叶 · WYX.SPACE" />
    <meta
      property="og:description"
      content="把想法做成能上线的东西 — AI 全栈 / 智能体开发作品集"
    />
    <meta property="og:url" content="https://wyx.space/" />
    <meta property="og:image" content="https://wyx.space/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="晓叶 · WYX.SPACE" />
    <meta
      name="twitter:description"
      content="把想法做成能上线的东西 — AI 全栈 / 智能体开发作品集"
    />
    <meta name="twitter:image" content="https://wyx.space/og-cover.png" />

    <!-- 站点图标：与顶部品牌 logo 同一张图（fx.md S1） -->
    <link rel="icon" href="/image/logo-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/image/logo-192.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="晓叶 · 文章订阅"
      href="/rss.xml"
    />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- F-12：首屏只阻塞 2 个字族（Bricolage + Noto Sans SC），display=optional 避免字体回退抖动；
         装饰字族（Caveat / JetBrains Mono）异步加载，加载前回退到系统手写体/等宽体 -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Noto+Sans+SC:wght@300;400;500;700;900&display=optional"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Noto+Sans+SC:wght@300;400;500;700;900&display=optional"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
    <!-- 首屏防闪烁：同源同步脚本在 CSS 之后、首次绘制之前落好 data-theme。
         抽成外部文件是为了让静态托管能开启 `script-src 'self'`（fx2 FE-15）。 -->
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
