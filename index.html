<!doctype html>
<html lang="zh-CN" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>晓叶 · WYX.SPACE</title>
    <meta
      name="description"
      content="晓叶的个人动态主页 — AI 全栈 / 智能体开发。项目、学习笔记、生活碎片与成长时间轴。"
    />
    <meta name="theme-color" content="#F4F0E6" />
    <meta name="author" content="晓叶" />
    <!-- 首帧底栏骨架与真底栏同步出现，这里内联样式保证在任何外部 CSS/JS 加载之前
         就具备正确定位与响应式行为（dev 下 CSS 由 JS 注入，生产下为外链，均有空窗）。 -->
    <style id="boot-tabbar-style">
      #boot-tabbar { display: block !important; }
      @media (min-width: 1024px) { #boot-tabbar { display: none !important; } }
    </style>
    <!-- 主题引导脚本同步执行，preload 减少一次往返（fx2 FE-15） -->
    <link rel="preload" as="script" href="/theme-boot.js" />

    <!-- SEO / 分享卡片（fx.md S1–S3）：页面级 title/description/canonical 由 useSeo 覆盖 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WYX.SPACE" />
    <meta property="og:title" content="晓叶 · WYX.SPACE" />
    <meta
      property="og:description"
      content="把想法做成能上线的东西 — AI 全栈 / 智能体开发作品集"
    />
    <meta property="og:url" content="https://wyx.space/" />
    <meta property="og:image" content="https://wyx.space/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="晓叶 · WYX.SPACE" />
    <meta
      name="twitter:description"
      content="把想法做成能上线的东西 — AI 全栈 / 智能体开发作品集"
    />
    <meta name="twitter:image" content="https://wyx.space/og-cover.png" />

    <!-- 站点图标：与顶部品牌 logo 同一张图（fx.md S1） -->
    <link rel="icon" href="/image/logo-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/image/logo-192.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="晓叶 · 文章订阅"
      href="/rss.xml"
    />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- F-12：全部字族统一 display=optional —— 字体没在 100ms 内到位就一直用系统回退，
         绝不「加载一会儿」再二次替换并重排整页（移动端表现为自动上滑/下滑）。
         两个 CSS 都改成 media=print + onload 异步生效，外链字体不再阻塞首屏绘制。 -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Noto+Sans+SC:wght@300;400;500;700;900&display=optional"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Noto+Sans+SC:wght@300;400;500;700;900&display=optional"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=JetBrains+Mono:wght@400;500&display=optional"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Noto+Sans+SC:wght@300;400;500;700;900&display=optional"
      />
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=JetBrains+Mono:wght@400;500&display=optional"
      />
    </noscript>
    <!-- 首屏防闪烁：同源同步脚本在 CSS 之后、首次绘制之前落好 data-theme。
         抽成外部文件是为了让静态托管能开启 `script-src 'self'`（fx2 FE-15）。 -->
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <!-- 首帧底栏骨架：底栏是 React portal（CSR），水合/JS 未就绪时 DOM 里没有它。
         弱网下会被放大成「打开首页看不到底栏，滑到底才出现」。这份静态版用内联样式
         保证首帧即显示、链接可点；React 的 MobileTabBar 挂载后会移除它，避免重复。
         放在 #root 之外，避免影响 prerender.mjs 注入正文的空 root 正则。 -->
    <nav
      id="boot-tabbar"
      aria-label="底部导航"
      style="position: fixed; inset-inline: 0; bottom: 0; z-index: 85; padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); box-sizing: border-box; display: block;"
    >
      <div style="max-width: 28rem; margin: 0 auto; display: flex; gap: 2px; border: 1.5px solid rgb(var(--c-ink, 20 20 15)); background: rgb(var(--c-bg, 244 240 230) / 0.95); border-radius: 20px; padding: 6px; box-shadow: 4px 4px 0 rgb(var(--c-ink, 20 20 15));">
        <a href="/" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 3px; border-radius: 14px; border: 1.5px solid rgb(var(--c-ink, 20 20 15)); background: rgb(var(--c-lime, 201 241 88)); color: rgb(var(--c-ink, 20 20 15)); text-decoration: none; font-size: 9.5px; font-weight: 700; line-height: 1;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22v-8h6v8"/></svg>
          <span>首页</span>
        </a>
        <a href="/learn" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 3px; border-radius: 14px; color: rgb(var(--c-ink, 20 20 15) / 0.45); text-decoration: none; font-size: 9.5px; font-weight: 700; line-height: 1;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>
          <span>AI知识库</span>
        </a>
        <a href="/life/moments" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 3px; border-radius: 14px; color: rgb(var(--c-ink, 20 20 15) / 0.45); text-decoration: none; font-size: 9.5px; font-weight: 700; line-height: 1;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
          <span>生活</span>
        </a>
        <a href="/me/media" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 3px; border-radius: 14px; color: rgb(var(--c-ink, 20 20 15) / 0.45); text-decoration: none; font-size: 9.5px; font-weight: 700; line-height: 1;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>我的</span>
        </a>
        <a href="/ai" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 3px; border-radius: 14px; color: rgb(var(--c-ink, 20 20 15) / 0.45); text-decoration: none; font-size: 9.5px; font-weight: 700; line-height: 1;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3z"/></svg>
          <span>AI分身</span>
        </a>
      </div>
    </nav>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
