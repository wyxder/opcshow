<!doctype html>
<html lang="zh-CN" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>魏云潇 · WYX.SPACE</title>
    <meta
      name="description"
      content="魏云潇的个人动态主页 — AI 全栈 / 智能体开发。项目、学习笔记、生活碎片与成长时间轴。"
    />
    <meta name="theme-color" content="#F4F0E6" />
    <meta property="og:title" content="魏云潇 · WYX.SPACE" />
    <meta
      property="og:description"
      content="把想法做成能上线的东西 — AI 全栈 / 智能体开发作品集"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23C9F158' stroke='%2314140F' stroke-width='4'/%3E%3Ctext x='32' y='45' font-size='36' font-family='Arial Black, Arial, sans-serif' font-weight='900' text-anchor='middle' fill='%2314140F'%3EW%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Caveat:wght@500;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <script>
      // 首屏防闪烁：在 CSS 与 React 之前就落好 data-theme。
      // 只读取 id，默认值由 CSS 的 :root（= paper）兜底，避免主题清单出现第二份来源。
      (function () {
        var t = "paper";
        try {
          t = localStorage.getItem("wyx:theme") || "paper";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
