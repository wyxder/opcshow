    <!-- 静态资源落到 public/，不再用内联 data URI（fx.md S1） -->

    <link rel="manifest" href="/site.webmanifest" />
    <link
      rel="alternate"
      type="application/rss+xml"
      title="魏云潇 · 文章订阅"

    />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Caveat:wght@500;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <script>
      // 首屏防闪烁：在 CSS 与 React 之前就落好 data-theme。
      // 读取顺序与 src/theme/theme.ts 的 readStoredTheme() 保持一致：
      //   带版本的 key（wyx:theme@v1）→ 旧 key（wyx:theme，顺手迁移）→ 系统深色偏好 → paper。
      // 这里必须内联（不能 import 模块），所以常量与 src/theme/theme.ts 的
      // INLINE_BOOT_THEME / INLINE_STORAGE_KEY 成对维护。
      (function () {
        var IDS = ["paper", "lab", "swiss", "terminal", "pop"];
        var t = "paper";
        var dark = false;
        try {
          dark = !!(
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
          );
          var v =
            localStorage.getItem("wyx:theme@v1") ||
            localStorage.getItem("wyx:theme");
          if (v && IDS.indexOf(v) >= 0) {
            localStorage.setItem("wyx:theme@v1", v);
            try {
              localStorage.removeItem("wyx:theme");
            } catch (e) {}
            t = v;
          } else if (dark) {
            t = "terminal";
          }
        } catch (e) {
          t = dark ? "terminal" : "paper";
        }
        document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
