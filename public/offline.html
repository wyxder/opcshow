<!doctype html>
<html lang="zh-CN" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>离线 · 晓叶 WYX.SPACE</title>
    <meta name="theme-color" content="#F4F0E6" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/image/logo-192.png" type="image/png" sizes="192x192" />
    <style>
      :root {
        --paper: #f4f0e6;
        --surface: #fbf8f1;
        --ink: #14140f;
        --lime: #c9f158;
        --muted: #6b6a60;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--paper);
        color: var(--ink);
        font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        background-image: linear-gradient(rgba(20, 20, 15, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(20, 20, 15, 0.06) 1px, transparent 1px);
        background-size: 28px 28px;
      }
      .card {
        max-width: 480px;
        width: 100%;
        padding: 32px;
        background: var(--surface);
        border: 2px solid var(--ink);
        box-shadow: 8px 8px 0 var(--ink);
      }
      .tag {
        display: inline-block;
        padding: 4px 12px;
        margin-bottom: 18px;
        font-size: 13px;
        letter-spacing: 0.08em;
        background: var(--lime);
        border: 1.5px solid var(--ink);
      }
      h1 { margin: 0 0 12px; font-size: 28px; line-height: 1.3; }
      p { margin: 0 0 12px; color: var(--muted); line-height: 1.7; }
      .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 22px; }
      button, a {
        font: inherit;
        padding: 10px 18px;
        border: 1.5px solid var(--ink);
        background: var(--surface);
        color: var(--ink);
        text-decoration: none;
        cursor: pointer;
      }
      button { background: var(--ink); color: var(--surface); }
      button:hover, a:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--ink); }
      .hint { margin-top: 20px; font-size: 13px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main class="card">
      <span class="tag">OFFLINE</span>
      <h1>网络断开了，先看离线壳</h1>
      <p>你现在处于离线状态。访问过的页面仍可打开，其余页面和接口需要联网后恢复。</p>
      <p>接口不会返回假数据：AI 助手、留言提交与后台操作在离线时都会明确失败。</p>
      <div class="actions">
        <button type="button" onclick="location.reload()">重新连接后刷新</button>
        <a href="/">回到首页</a>
      </div>
      <p class="hint">WYX.SPACE · 离线页由 Service Worker 提供</p>
    </main>
  </body>
</html>
