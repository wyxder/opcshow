<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>8 款主题方向对比 · 魏云潇个人站</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #0f0f10;
        color: #e9e9ea;
        font:
          15px/1.7 system-ui,
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .top-head {
        max-width: 1180px;
        margin: 0 auto;
        padding: 46px 24px 10px;
      }
      .top-head p.k {
        margin: 0 0 14px;
        font:
          10.5px/1 ui-monospace,
          Consolas,
          monospace;
        letter-spacing: 0.26em;
        color: #7f7f86;
        text-transform: uppercase;
      }
      .top-head h1 {
        margin: 0;
        font-size: clamp(24px, 3.4vw, 34px);
        line-height: 1.2;
        letter-spacing: -0.02em;
      }
      .top-head .sub {
        max-width: 64ch;
        margin: 14px 0 0;
        color: #9b9ba3;
        font-size: 13px;
        line-height: 1.95;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 18px 0 0;
      }
      .legend span {
        padding: 5px 11px;
        border: 1px solid #303038;
        border-radius: 99px;
        font-size: 11px;
        color: #b6b6bf;
      }
      .boards {
        max-width: 1180px;
        margin: 0 auto;
        padding: 14px 24px 70px;
        display: grid;
        gap: 38px;
      }
      .tag {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 8px;
        font-size: 12px;
        color: #cfcfd6;
      }
      .tag b {
        font-size: 13px;
        color: #fff;
      }
      .tag em {
        font:
          9.5px/1 ui-monospace,
          Consolas,
          monospace;
        font-style: normal;
        letter-spacing: 0.2em;
        color: #8a8a93;
      }
      .tag span {
        margin-left: auto;
        font-size: 11.5px;
        color: #8a8a93;
      }
      .sw {
        display: flex;
        gap: 4px;
      }
      .sw i {
        display: block;
        width: 13px;
        height: 13px;
        border-radius: 3px;
        border: 1px solid rgba(140, 140, 150, 0.45);
      }
      .board {
        position: relative;
        overflow: hidden;
        border-radius: 16px;
        background: var(--bg);
        color: var(--tx);
        font-family: var(--fb);
        font-size: 14px;
        line-height: 1.7;
      }
      .board::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: var(--tex);
        background-size: var(--ts, auto);
        opacity: var(--to);
        mix-blend-mode: var(--tb);
      }
      .in {
        position: relative;
        z-index: 1;
        max-width: 1040px;
        margin: 0 auto;
        padding: 0 30px;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 0;
        border-bottom: var(--bw) solid var(--ln2);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 13px;
        font-weight: 700;
        line-height: 1.1;
      }
      .brand i {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: var(--rx);
        border: var(--bw) solid var(--ln);
        background: var(--ac);
        color: var(--aci);
        font-family: var(--fd);
        font-weight: 800;
        font-style: normal;
        font-size: 13px;
      }
      .brand small {
        display: block;
        margin-top: 3px;
        font: 8.5px/1 var(--fm);
        font-weight: 400;
        letter-spacing: 0.18em;
        color: var(--mu);
      }
      nav {
        display: flex;
        gap: 2px;
        font-size: 12px;
      }
      nav a {
        padding: 6px 10px;
        border-radius: var(--br);
        color: var(--mu);
      }
      nav a.on {
        color: var(--tx);
        background: var(--sf2);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 9px 16px;
        border: var(--bw) solid var(--ln);
        border-radius: var(--br);
        background: var(--sf);
        color: var(--tx);
        font: 600 12px/1 var(--fb);
        box-shadow: var(--sh);
        cursor: pointer;
        text-transform: var(--tt);
      }
      .btn.ac {
        background: var(--ac);
        color: var(--aci);
        border-color: var(--ac);
      }
      .btn.so {
        background: var(--tx);
        color: var(--bg);
        border-color: var(--tx);
      }
      .btn.gh {
        background: transparent;
        border-style: dashed;
        border-color: var(--ln2);
        box-shadow: none;
      }
      .hero {
        display: grid;
        grid-template-columns: 1.42fr 0.58fr;
        gap: 34px;
        padding: 38px 0 28px;
        align-items: start;
      }
      .kick {
        margin: 0;
        font: 10px/1 var(--fm);
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--mu);
      }
      h1 {
        margin: 12px 0 0;
        font-family: var(--fd);
        font-weight: var(--dw);
        letter-spacing: var(--dt);
        text-transform: var(--tt);
        font-size: clamp(30px, 4.3vw, 46px);
        line-height: 1.03;
      }
      h1 u {
        text-decoration: none;
        padding: 0 4px;
        background: linear-gradient(
          transparent 56%,
          var(--ac) 56%,
          var(--ac) 96%,
          transparent 96%
        );
      }
      .lede {
        max-width: 46ch;
        margin-top: 16px;
        color: var(--tx2);
        font-size: 12.5px;
        line-height: 1.9;
      }
      .acts {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 20px;
      }
      .metas {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 18px;
        padding-top: 12px;
        border-top: 1px dashed var(--ln2);
        font: 9.5px/1 var(--fm);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--mu);
      }
      .metas b {
        color: var(--ac2);
        font-weight: 400;
      }
      .card {
        background: var(--sf);
        border: var(--bw) solid var(--ln);
        border-radius: var(--r);
        box-shadow: var(--sh);
        backdrop-filter: var(--blur);
        -webkit-backdrop-filter: var(--blur);
      }
      .aside {
        padding: 18px;
      }
      .av {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: var(--rs);
        border: var(--bw) solid var(--ln);
        background: var(--ac);
        color: var(--aci);
        font-family: var(--fd);
        font-weight: 800;
        font-size: 18px;
      }
      .aside .nm {
        display: block;
        margin-top: 10px;
        font-family: var(--fd);
        font-weight: var(--dw);
        font-size: 16px;
        letter-spacing: var(--dt);
      }
      .aside .rl {
        margin-top: 4px;
        font-size: 10.5px;
        color: var(--mu);
      }
      .kv {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 6px 0;
        border-bottom: 1px dashed var(--ln2);
        font-size: 11px;
      }
      .kv:last-child {
        border-bottom: 0;
      }
      .kv span {
        font: 8.5px/1 var(--fm);
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--mu);
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      .st {
        padding: 14px;
        border: var(--bw) solid var(--ln);
        border-radius: var(--rs);
        background: var(--sf);
        box-shadow: var(--sh);
      }
      .st b {
        display: block;
        font-family: var(--fd);
        font-weight: var(--dw);
        font-size: 23px;
        line-height: 1;
        letter-spacing: var(--dt);
      }
      .st b i {
        margin-left: 2px;
        font-style: normal;
        font-size: 0.5em;
        color: var(--ac2);
      }
      .st span {
        display: block;
        margin-top: 7px;
        font-size: 10.5px;
        color: var(--mu);
      }
      .head {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 14px;
        margin: 34px 0 12px;
        padding-bottom: 10px;
        border-bottom: var(--bw) solid var(--ln2);
      }
      .head h2 {
        margin: 0;
        font-family: var(--fd);
        font-weight: var(--dw);
        font-size: 17px;
        letter-spacing: var(--dt);
        text-transform: var(--tt);
      }
      .head em {
        display: block;
        margin-top: 6px;
        font: 8.5px/1 var(--fm);
        font-style: normal;
        letter-spacing: 0.22em;
        color: var(--mu);
      }
      .head .more {
        font: 8.5px/1 var(--fm);
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--mu);
      }
      .work {
        display: grid;
        grid-template-columns: 1.08fr 0.92fr;
        overflow: hidden;
      }
      .wb {
        padding: 20px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        padding: 4px 9px;
        border: var(--bw) solid var(--ln2);
        border-radius: var(--br);
        background: var(--sf);
        color: var(--tx2);
        font-size: 10px;
      }
      .chip.ac {
        background: var(--ac);
        color: var(--aci);
        border-color: var(--ac);
      }
      .work h3 {
        margin: 12px 0 0;
        font-family: var(--fd);
        font-weight: var(--dw);
        font-size: 19px;
        line-height: 1.22;
        letter-spacing: var(--dt);
      }
      .work .d {
        margin-top: 8px;
        color: var(--tx2);
        font-size: 11.5px;
        line-height: 1.8;
      }
      .ms {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin-top: 14px;
      }
      .ms div {
        padding: 8px;
        border: var(--bw) solid var(--ln2);
        border-radius: var(--rx);
        background: var(--sf2);
      }
      .ms em {
        display: block;
        font: 8px/1 var(--fm);
        font-style: normal;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--mu);
      }
      .ms b {
        display: block;
        margin-top: 3px;
        font-size: 10.5px;
      }
      .plate {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 196px;
        padding: 14px;
        border-left: var(--bw) solid var(--ln);
        background-color: var(--sf2);
        background-image:
          radial-gradient(
            circle at 76% 18%,
            var(--ac) 0 14%,
            transparent 14.5%
          ),
          radial-gradient(
            circle at 22% 80%,
            var(--ac2) 0 10%,
            transparent 10.5%
          ),
          repeating-linear-gradient(
            45deg,
            transparent 0 12px,
            var(--ln2) 12px 13px
          );
      }
      .plate b {
        font-family: var(--fd);
        font-weight: 800;
        font-size: 52px;
        line-height: 1;
        color: var(--tx);
        opacity: 0.14;
        text-align: right;
      }
      .plate span {
        align-self: flex-start;
        padding: 4px 8px;
        border: 1px solid var(--ln2);
        border-radius: var(--br);
        background: var(--sf);
        font: 8px/1 var(--fm);
        letter-spacing: 0.16em;
        color: var(--mu);
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 10px;
      }
      .panel {
        padding: 18px;
      }
      .panel h3 {
        margin: 0;
        font-family: var(--fd);
        font-weight: var(--dw);
        font-size: 13.5px;
        letter-spacing: var(--dt);
      }
      .br {
        display: grid;
        grid-template-columns: 84px 1fr 28px;
        align-items: center;
        gap: 10px;
        margin-top: 9px;
        font-size: 11px;
      }
      .tr {
        height: 6px;
        border: var(--bw) solid var(--ln2);
        border-radius: var(--br);
        background: var(--sf2);
        overflow: hidden;
      }
      .tr i {
        display: block;
        height: 100%;
        background: var(--ac);
      }
      .br em {
        font: 8.5px/1 var(--fm);
        font-style: normal;
        color: var(--mu);
        text-align: right;
      }
      .qcard {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 18px;
        border: var(--bw) solid var(--ln);
        border-radius: var(--r);
        background: var(--tx);
        color: var(--bg);
      }
      .qcard h3 {
        margin: 8px 0 0;
        font-family: var(--fd);
        font-weight: var(--dw);
        font-size: 15.5px;
        line-height: 1.34;
        letter-spacing: var(--dt);
      }
      .qcard p {
        margin-top: 10px;
        font-size: 10.5px;
        line-height: 1.8;
        opacity: 0.62;
      }
      .foot {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 10px;
        margin-top: 28px;
        padding: 13px 0 18px;
        border-top: var(--bw) solid var(--ln2);
        font: 8.5px/1.4 var(--fm);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--mu);
      }
      @media (max-width: 820px) {
        .hero {
          grid-template-columns: 1fr;
        }
        .work {
          grid-template-columns: 1fr;
        }
        .plate {
          border-left: 0;
          border-top: var(--bw) solid var(--ln);
        }
        .stats {
          grid-template-columns: repeat(2, 1fr);
        }
        .two {
          grid-template-columns: 1fr;
        }
        nav {
          display: none;
        }
      }

      .t1 {
        --bg: #f4f0e6;
        --sf: #fbf8f1;
        --sf2: #eae1cf;
        --tx: #14140f;
        --tx2: #45453b;
        --mu: #8b8674;
        --ln: #14140f;
        --ln2: rgba(20, 20, 15, 0.16);
        --bw: 1.5px;
        --ac: #c9f158;
        --aci: #14140f;
        --ac2: #ff5a2b;
        --r: 20px;
        --rs: 12px;
        --rx: 8px;
        --br: 99px;
        --sh: 4px 4px 0 var(--ln);
        --fd: system-ui, sans-serif;
        --fb: system-ui, sans-serif;
        --fm: ui-monospace, Consolas, monospace;
        --dw: 800;
        --dt: -0.03em;
        --tt: none;
        --tex: none;
        --to: 0;
        --tb: normal;
        --blur: none;
      }
      .t2 {
        --bg: #eef2f6;
        --sf: #ffffff;
        --sf2: #e2eaf1;
        --tx: #0b1b2a;
        --tx2: #42576b;
        --mu: #7c93a8;
        --ln: #b9c9d8;
        --ln2: rgba(11, 27, 42, 0.14);
        --bw: 1px;
        --ac: #1f6bff;
        --aci: #ffffff;
        --ac2: #00c8b4;
        --r: 6px;
        --rs: 4px;
        --rx: 2px;
        --br: 6px;
        --sh: 0 2px 0 rgba(11, 27, 42, 0.06);
        --fd: system-ui, sans-serif;
        --fb: system-ui, sans-serif;
        --fm: ui-monospace, Consolas, monospace;
        --dw: 700;
        --dt: -0.01em;
        --tt: none;
        --tex:
          linear-gradient(rgba(11, 27, 42, 0.055) 1px, transparent 1px),
          linear-gradient(90deg, rgba(11, 27, 42, 0.055) 1px, transparent 1px);
        --ts: 22px 22px;
        --to: 1;
        --tb: normal;
        --blur: none;
      }
      .t2 .kick,
      .t2 .head em,
      .t2 .chip {
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .t2 .st {
        box-shadow: inset 0 2px 0 var(--ac);
      }
      .t2 .plate {
        background-image:
          repeating-linear-gradient(
            0deg,
            var(--ln2) 0 1px,
            transparent 1px 20px
          ),
          repeating-linear-gradient(
            90deg,
            var(--ln2) 0 1px,
            transparent 1px 20px
          ),
          radial-gradient(circle at 76% 20%, var(--ac) 0 9%, transparent 9.6%);
      }
      .t2 h1 u {
        background: linear-gradient(
          transparent 56%,
          rgba(31, 107, 255, 0.26) 56%,
          rgba(31, 107, 255, 0.26) 96%,
          transparent 96%
        );
      }
      .t3 {
        --bg: #f7f7f4;
        --sf: #fff;
        --sf2: #ecece7;
        --tx: #0d0d0d;
        --tx2: #4a4a48;
        --mu: #8a8a86;
        --ln: #0d0d0d;
        --ln2: rgba(13, 13, 13, 0.22);
        --bw: 1px;
        --ac: #e4002b;
        --aci: #fff;
        --ac2: #0d0d0d;
        --r: 0;
        --rs: 0;
        --rx: 0;
        --br: 0;
        --sh: none;
        --fd: system-ui, "Helvetica Neue", sans-serif;
        --fb: system-ui, sans-serif;
        --fm: ui-monospace, monospace;
        --dw: 800;
        --dt: -0.045em;
        --tt: uppercase;
        --tex: none;
        --to: 0;
        --tb: normal;
        --blur: none;
      }
      .t4 {
        --bg: #0a0a14;
        --sf: rgba(255, 255, 255, 0.07);
        --sf2: rgba(255, 255, 255, 0.05);
        --tx: #f3f2ff;
        --tx2: #c3c2dd;
        --mu: #8b8aae;
        --ln: rgba(255, 255, 255, 0.22);
        --ln2: rgba(255, 255, 255, 0.14);

        --ac2: #35e0ff;

        --dw: 700;

        --tex: none;

        --tb: normal;

          radial-gradient(46% 46% at 92% 8%, #0d4f63 0, transparent 58%),
          #0a0a14;
      }
      .t5 {
        --bg: #050908;
        --sf: #0a1210;
        --sf2: #0d1a16;
        --tx: #c9ffd4;
        --tx2: #8fbba0;
        --mu: #5c7a66;
        --ln: #24402f;
        --ln2: rgba(107, 255, 122, 0.18);
        --bw: 1px;
        --ac: #6bff7a;
        --aci: #04120a;
        --ac2: #ffd166;
        --r: 2px;
        --rs: 2px;
        --rx: 2px;
        --br: 2px;
        --sh: none;
        --fd: ui-monospace, Consolas, monospace;
        --fb: ui-monospace, Consolas, monospace;
        --fm: ui-monospace, Consolas, monospace;
        --dw: 700;
        --dt: 0;
        --tt: none;
        --tex: repeating-linear-gradient(
          0deg,
          rgba(107, 255, 122, 0.055) 0 1px,
          transparent 1px 3px
        );
        --ts: auto;
        --to: 1;
        --tb: normal;
        --blur: none;
      }
      .t6 {
        --bg: #fff7f2;
        --sf: #ffffff;
        --sf2: #ffe9f0;
        --tx: #241b2b;
        --tx2: #5b4f66;
        --mu: #9a8fa6;
        --ln: #f0c9d8;
        --ln2: rgba(36, 27, 43, 0.12);
        --bw: 1.5px;
        --ac: #ff4e87;
        --aci: #ffffff;
        --ac2: #ffb72b;
        --r: 26px;
        --rs: 18px;
        --rx: 12px;
        --br: 99px;
        --sh: 0 20px 44px -26px rgba(255, 78, 135, 0.6);
        --fd: system-ui, sans-serif;
        --fb: system-ui, sans-serif;
        --fm: ui-monospace, Consolas, monospace;
        --dw: 800;
        --dt: -0.025em;
        --tt: none;
        --tex: none;
        --to: 0;
        --tb: normal;
        --blur: none;
        background:
          radial-gradient(58% 46% at 100% 0%, #ffe3ef 0, transparent 62%),
          radial-gradient(46% 40% at 0% 12%, #e6f1ff 0, transparent 58%),
          radial-gradient(40% 36% at 50% 100%, #fff6dc 0, transparent 60%),
          #fff7f2;
      }
      .t6 h1 u {
        background: linear-gradient(
          transparent 54%,
          rgba(255, 183, 43, 0.55) 54%,
          rgba(255, 183, 43, 0.55) 96%,
          transparent 96%
        );
      }
      .t6 .st:nth-child(2) {
        background: #fff8e6;
      }
      .t6 .st:nth-child(3) {
        background: #eaf8f2;
      }
      .t6 .st:nth-child(4) {
        background: #eef2ff;
      }
      .t6 .av {
        border-radius: 50%;
